discovery.uri=http://coordinator:8082
http-server.http.port=7777
presto.version=0.297-SNAPSHOT-b238a23

system-memory-gb=500
query-memory-gb=450
query.max-memory-per-node=450GB
driver.num-cpu-threads-hw-multiplier=8.0
# system-memory-gb=250
# query-memory-gb=200
# query.max-memory-per-node=200GB

# memory-arbitrator-kind=SHARED
# shared-arbitrator.global-arbitration-enabled=true


# shared-arbitrator.memory-pool-initial-capacity=8GB  
# shared-arbitrator.memory-pool-abort-capacity-limit=64GB

# spill-enabled=true
# join-spill-enabled=true
# aggregation-spill-enabled=true
# order-by-spill-enabled=true
# max-spill-bytes=500GB

exchange.http-client.request-timeout=5m
exchange.http-client.connect-timeout=30s

# Exchange 客户端线程数，用于从其他节点拉取数据
# exchange.client-threads=8
# 并发请求倍数，决定相对于可用缓冲区的并发请求数量
# exchange.concurrent-request-multiplier=4

# system-mem-pushback-enabled=true
# system-mem-limit-gb=48

# enable-memory-leak-check=true
# experimental.spiller-spill-path=/data
